<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遠端文件助手</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head><body><header><h1>遠端文件助手</h1><span>唯讀 · 本機第一版</span></header><main>
{% if not signed_in %}<section><h2>登入</h2><p>只存取公司電腦已授權的資料夾。</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="/signin">{% csrf_token %}<label>帳號<input name="username" autocomplete="username" required maxlength="150"></label><label>密碼<input type="password" name="password" autocomplete="current-password" required></label><button>登入</button></form></section>
{% else %}<div id="app"><section><label>允許的資料夾<select id="roots"></select></label><p id="rootStatus"></p><form id="searchForm">{% csrf_token %}<label>搜尋檔名<input id="query" placeholder="中文、英文或部分字詞" maxlength="200" type="search"></label><div class="grid"><label>副檔名<input id="extension" placeholder="例如 pdf" maxlength="20"></label><label>排序<select id="sort"><option value="name">名稱</option><option value="modified">修改時間</option><option value="size">大小</option></select></label><label>由此日期<input id="after" type="date"></label><label>至此日期<input id="before" type="date"></label></div><label class="check"><input id="recursive" type="checkbox">搜尋全部子資料夾</label><label class="check"><input id="descending" type="checkbox">倒序</label><div class="actions"><button>搜尋／重新整理</button><button id="cancel" type="button" class="secondary">取消搜尋</button></div></form></section><nav><button id="up" class="secondary">上一層</button><span id="location">根目錄</span></nav><p id="status" role="status" aria-live="polite"></p><div id="results"></div><nav class="actions"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></nav><section><h2>已登入裝置</h2><p>裝置以登入編號識別；可撤銷其他登入。</p><button id="loadDevices" class="secondary">查看裝置</button><div id="devices"></div></section></div><form method="post" action="/signout">{% csrf_token %}<button class="secondary">登出此裝置</button></form>
<form id="fileForm" method="post" target="documentPreview">{% csrf_token %}<input name="root" type="hidden"><input name="path" type="hidden"></form><section id="previewPanel" hidden><h2>文件預覽</h2><button id="closePreview" class="secondary">關閉預覽</button><p>不支援的格式請下載；預覽上限 20 MiB。</p><div class="actions"><button id="downloadPreview">下載目前文件</button><button id="pdfPrev" hidden>上一頁</button><button id="pdfNext" hidden>下一頁</button></div><p id="pdfStatus" role="status"></p><canvas id="pdfCanvas" hidden aria-label="PDF 頁面"></canvas><iframe name="documentPreview" title="文件預覽" sandbox="allow-same-origin"></iframe></section>{% endif %}
<footer>遠端使用須由 IT 配置 HTTPS、私人網絡與 MFA。此版本沒有公開入口。</footer></main></body></html>
